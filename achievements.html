<body>

<div class="stub-shell">
  <nav class="stub-nav">
    <a href="index.html" class="brand">

      Scholar Brilliance
    </a>
    <div style="display:flex; align-items:center; gap:24px;">
      <a href="dashboard.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Dashboard</a>
      <a href="tracker.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Tracker</a>
      <a href="browse.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Browse</a>
      <a href="essays.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">My Essays</a>
      <a href="achievements.html" style="font-size:14.5px; font-weight:600; color:var(--fg);">Achievements</a>
      <a href="leaderboard.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Leaderboard</a>
      <a href="account.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Account</a>
      <button id="logout-btn" class="btn btn-line">Log out</button>
    </div>
  </nav>

  <main style="flex:1; padding:56px 24px; max-width:960px; margin:0 auto; width:100%;">

    <div class="level-card">
      <span class="eyebrow">My achievements</span>
      <h1 id="level-heading">Loading…</h1>
      <div class="level-meta">
        <span id="level-xp">— XP</span>
        <span id="level-remaining">—</span>
      </div>
      <div class="level-track"><div class="level-fill" id="level-fill" style="width:0%;"></div></div>
    </div>

    <section class="achv-section">
      <h2>Early Wins</h2>
      <div class="achv-grid" id="early-wins-grid"></div>
    </section>

    <section class="achv-section">
      <h2>Streak Milestones</h2>
      <div class="achv-grid" id="streak-grid"></div>
    </section>

    <section class="achv-section">
      <h2>Application Milestones</h2>
      <div class="achv-grid" id="milestones-grid"></div>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
