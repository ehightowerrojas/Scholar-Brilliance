<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Manager — Scholar Brilliance Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stub-shell">
  <nav class="stub-nav">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L20 5V11C20 16.5 16.5 20.5 12 22C7.5 20.5 4 16.5 4 11V5L12 2Z" fill="#5E35B1"/><path d="M12 5.3L13 7.9H15.6L13.5 9.5L14.3 12L12 10.5L9.7 12L10.5 9.5L8.4 7.9H11L12 5.3Z" fill="#FFC107"/><path d="M7 14.8C8.6 13.9 10.3 13.6 12 14.2C13.7 13.6 15.4 13.9 17 14.8C15.7 16.4 13.9 17.4 12 17.6C10.1 17.4 8.3 16.4 7 14.8Z" fill="#ffffff"/></svg></span>
      Scholar Brilliance <span style="color:var(--muted); font-weight:400; font-size:13px;">Staff</span>
    </a>
    <div style="display:flex; align-items:center; gap:24px;">
      <a href="staff-dashboard.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Dashboard</a>
      <a href="staff-referrals.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Referral Codes</a>
      <a href="staff-students.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Student Progress</a>
      <a href="staff-scholarships.html" style="font-size:14.5px; font-weight:600; color:var(--fg);">Scholarships</a>
      <button id="logout-btn" class="btn btn-line">Log out</button>
    </div>
  </nav>

  <main style="flex:1; padding:48px 24px; max-width:900px; margin:0 auto; width:100%;">
    <div class="tracker-head">
      <div>
        <span class="eyebrow">Scholarship management</span>
        <h1 style="font-size:clamp(22px,3vw,28px); margin-top:8px;">Your organization's scholarships.</h1>
      </div>
      <button class="btn btn-teal" id="add-toggle-btn">+ Add New Scholarship</button>
    </div>

    <form id="add-form" class="add-form" style="display:none;">
      <div class="add-form-grid">
        <div class="field">
          <label for="s-title">Title</label>
          <input type="text" id="s-title" placeholder="Future Leaders Scholarship" required>
        </div>
        <div class="field">
          <label for="s-amount">Amount ($)</label>
          <input type="number" id="s-amount" placeholder="4500" min="0" step="1">
        </div>
        <div class="field">
          <label for="s-deadline">Deadline</label>
          <input type="date" id="s-deadline">
        </div>
        <div class="field">
          <label for="s-website">Website</label>
          <input type="url" id="s-website" placeholder="https://...">
        </div>
      </div>
      <div class="field">
        <label for="s-description">Description</label>
        <input type="text" id="s-description" placeholder="Support for students demonstrating...">
      </div>
      <div class="add-form-actions">
        <button type="button" class="btn btn-ghost-dark" id="cancel-add-btn">Cancel</button>
        <button type="submit" class="btn btn-teal">Save scholarship</button>
      </div>
    </form>

    <div id="scholarships-list" class="catalog-list">Loading…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="staff-common.js"></script>
<script src="staff-scholarships.js"></script>

</body>
</html>
