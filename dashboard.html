<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Scholar Brilliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stub-shell">
  <nav class="stub-nav">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L20 5V11C20 16.5 16.5 20.5 12 22C7.5 20.5 4 16.5 4 11V5L12 2Z" fill="#5E35B1"/><path d="M12 5.3L13 7.9H15.6L13.5 9.5L14.3 12L12 10.5L9.7 12L10.5 9.5L8.4 7.9H11L12 5.3Z" fill="#FFC107"/><path d="M7 14.8C8.6 13.9 10.3 13.6 12 14.2C13.7 13.6 15.4 13.9 17 14.8C15.7 16.4 13.9 17.4 12 17.6C10.1 17.4 8.3 16.4 7 14.8Z" fill="#ffffff"/></svg></span>
      Scholar Brilliance
    </a>
    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
      <a href="dashboard.html" style="font-size:14.5px; font-weight:600; color:var(--fg);">Dashboard</a>
      <a href="tracker.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Tracker</a>
      <a href="browse.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Browse</a>
      <a href="essays.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">My Essays</a>
      <a href="achievements.html" style="font-size:14.5px; font-weight:600; color:var(--muted);">Achievements</a>
      <button id="logout-btn" class="btn btn-line">Log out</button>
    </div>
  </nav>

  <main style="flex:1; padding:48px 24px; max-width:1000px; margin:0 auto; width:100%;">

    <span class="eyebrow">Dashboard</span>
    <h1 id="welcome-heading" style="font-size:clamp(24px,3.2vw,34px); margin-top:8px;">Welcome back.</h1>
    <p id="welcome-subtext" class="dash-subtext">Loading your progress…</p>

    <div class="next-step-card" id="next-step-card">
      <div>
        <span class="next-step-label">Your next step</span>
        <h2 id="next-step-title">Loading…</h2>
        <p id="next-step-body"></p>
      </div>
      <a href="#" class="btn btn-gold" id="next-step-cta">Let's go</a>
    </div>

    <div class="dash-card goal-hero">
      <h3>Progress Toward Financial Goal</h3>
      <div id="goal-content">Loading…</div>
    </div>

    <div class="dash-stats-row" id="stats-content"></div>

    <div class="dash-grid-2">
      <div class="dash-card">
        <h3>Upcoming Deadlines</h3>
        <div id="deadlines-content">Loading…</div>
      </div>
      <div class="dash-card">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <h3>Recent Achievements</h3>
          <a href="achievements.html" style="font-size:12.5px; color:var(--purple); font-weight:600;">View all →</a>
        </div>
        <div id="achievements-content">Loading…</div>
      </div>
    </div>

    <div class="dash-card" style="margin-top:20px;">
      <h3>Recent Activity</h3>
      <div id="activity-content">Loading…</div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="achievements-award.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
